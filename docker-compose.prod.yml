services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # From 18 the image keeps PGDATA at /var/lib/postgresql/18/docker and
      # declares its volume at /var/lib/postgresql: mount there, or the data
      # lands in an anonymous volume instead of this named one. A new name
      # (was postgres_data, PostgreSQL 15), which is deliberately no longer
      # declared below: it survives `down -v` and stays the rollback target.
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    build:
      context: ./backend
    env_file: ${ENV_FILE:-.env.production}
    environment:
      # Migrations may run as a more privileged database role than the API
      # (see docs/security, S-17). Falls back to DATABASE_URL when unset.
      DATABASE_URL: ${MIGRATIONS_DATABASE_URL:-${DATABASE_URL}}
      PYTHONDONTWRITEBYTECODE: "1"
      # Fail closed on a database that has never been migrated (a new or
      # wrongly mounted volume) instead of serving an empty app: see
      # backend/alembic/env.py. Export =0 only for a deliberate first install.
      ALEMBIC_REFUSE_EMPTY_DATABASE: ${ALEMBIC_REFUSE_EMPTY_DATABASE:-1}
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  backend:
    build:
      context: ./backend
    env_file: ${ENV_FILE:-.env.production}
    environment:
      # Trust X-Forwarded-For/-Proto from the reverse proxy so the API sees
      # the real client IP (rate limiting, security logs). Safe because
      # port 8000 is reachable only from Caddy on the Docker network.
      FORWARDED_ALLOW_IPS: "*"
      # The browser sees the API under /api, so the refresh cookie is scoped
      # to the auth routes only instead of being sent with every request.
      REFRESH_COOKIE_PATH: /api/auth
      PYTHONDONTWRITEBYTECODE: "1"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # The API never writes to its own filesystem; uploads are spooled in
    # /tmp on the way to R2. A compromised process therefore cannot alter
    # code, escalate via setuid binaries, or use any Linux capability.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      target: assets
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    volumes:
      - frontend_assets:/output
    security_opt:
      - no-new-privileges:true
    restart: "no"

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_assets:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Only the capability needed to bind 80/443; nothing else.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres18_data:
  frontend_assets:
  caddy_data:
  caddy_config:
